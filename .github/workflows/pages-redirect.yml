name: Deploy Pages Redirect

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate redirect page
        run: |
          mkdir -p _site
          cat > _site/index.html << 'EOF'
          <!doctype html>
          <html lang="fr">
          <head>
            <meta charset="utf-8" />
            <meta name="viewport" content="width=device-width, initial-scale=1" />
            <meta http-equiv="refresh" content="0; url=https://y8.com/games/high_noon" />
            <title>Redirection vers Y8...</title>
            <style>
              body { 
                font-family: sans-serif; 
                margin: 0; 
                height: 100vh; 
                display: flex; 
                flex-direction: column; 
                align-items: center; 
                justify-content: center; 
                background: #ffffff; 
                color: #333333; 
              }
              a { color: #d97706; text-decoration: none; font-weight: bold; }
              a:hover { text-decoration: underline; }
              .spinner {
                width: 40px;
                height: 40px;
                border: 4px solid #e5e7eb;
                border-top: 4px solid #000000;
                border-radius: 50%;
                animation: spin 0.5s linear infinite;
                margin-bottom: 20px;
              }
              @keyframes spin {
                0% { transform: rotate(0deg); }
                100% { transform: rotate(360deg); }
              }
              #fallback-link {
                opacity: 0;
                transition: opacity 0.5s ease;
                text-align: center;
                padding: 0 20px;
              }
            </style>
          </head>
          <body>
            <div class="spinner"></div>
            <p id="fallback-link">Si la redirection ne se fait pas automatiquement, <a href="https://y8.com/games/high_noon" style="color: #e50000;">cliquez ici</a>.</p>
            <script>
              window.location.replace("https://y8.com/games/high_noon");
              setTimeout(function() {
                document.getElementById("fallback-link").style.opacity = "1";
              }, 2000);
            </script>
          </body>
          </html>
          EOF
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
